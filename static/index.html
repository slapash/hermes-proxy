<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Hermes Chat</title>
  <!-- marked.js v15.0.12 — update version + integrity hash together when upgrading -->
  <script
    src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
    integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
    crossorigin="anonymous"
  ></script>
  <!-- DOMPurify v3.2.4 — update version + integrity hash together when upgrading -->
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"
    integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu"
    crossorigin="anonymous"
  ></script>
  <!-- highlight.js github-dark theme -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
    crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface2: #222;
      --accent: #00ff88;
      --text: #e0e0e0;
      --muted: #666;
      --border: #2a2a2a;
      --user-bubble: #1e3a2a;
      --sidebar-w: 260px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Menlo', 'Monaco', 'Consolas', monospace; font-size: 14px; overflow: hidden; }

    /* ── Login overlay ── */
    #login-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    #login-overlay.hidden { display: none; }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 40px;
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .login-box h1 { color: var(--accent); font-size: 20px; letter-spacing: 1px; }
    .login-box input[type=password] {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 4px; width: 100%; font-family: inherit; font-size: 16px;
      outline: none;
    }
    .login-box input[type=password]:focus { border-color: var(--accent); }
    .login-box button {
      background: var(--accent); color: #000; border: none; border-radius: 4px;
      padding: 10px; font-family: inherit; font-size: 14px; font-weight: bold;
      cursor: pointer; transition: opacity .15s;
    }
    .login-box button:hover { opacity: .85; }
    #login-error { color: #ff4466; font-size: 13px; min-height: 18px; }

    /* ── App layout ── */
    #app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
    #app.hidden { display: none; }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    #new-session-btn {
      flex: 1;
      background: transparent; border: 1px solid var(--accent); color: var(--accent);
      padding: 7px 12px; border-radius: 4px; font-family: inherit; font-size: 13px;
      cursor: pointer; transition: background .15s, color .15s;
    }
    #new-session-btn:hover { background: var(--accent); color: #000; }
    #logout-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 4px; padding: 7px 10px; cursor: pointer; font-size: 14px; line-height: 1;
      transition: border-color .15s, color .15s; flex-shrink: 0;
    }
    #logout-btn:hover { border-color: #ff4466; color: #ff4466; }
    #session-list {
      flex: 1; overflow-y: auto; padding: 8px 0;
    }
    #session-list::-webkit-scrollbar { width: 4px; }
    #session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    #load-more-btn {
      display: none; width: 100%; padding: 8px 0; cursor: pointer;
      background: none; border: none; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 13px; flex-shrink: 0;
    }
    #load-more-btn:hover { color: var(--fg); background: var(--surface2); }
    .session-item {
      padding: 10px 14px; cursor: pointer; border-left: 3px solid transparent;
      transition: background .1s, border-color .1s;
    }
    .session-item:hover { background: var(--surface2); }
    .session-item.active { background: var(--surface2); border-left-color: var(--accent); }
    .session-item { position: relative; }
    .session-actions {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      display: none; gap: 2px; z-index: 10;
    }
    .session-item:hover .session-actions { display: flex; }
    .session-item.active .session-actions { display: flex; }
    .session-action-btn {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
      color: var(--muted); font-size: 11px; padding: 2px 6px; cursor: pointer;
      transition: background .1s, color .1s;
    }
    .session-action-btn:hover { background: var(--fg); color: var(--bg); }
    .session-action-btn.danger:hover { background: #ff4466; color: #fff; }
    @media (max-width: 767px) {
      /* On mobile, always show ⋮ button; expanded menu stays until dismissed */
      .session-actions { display: flex !important; }
    }
    .session-title { color: var(--text); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-date { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .session-group-header {
      padding: 8px 14px 4px; font-size: 11px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
      user-select: none; pointer-events: none;
    }
    .session-empty {
      padding: 24px 14px; text-align: center; color: var(--muted); font-size: 13px;
    }
    .session-snippet {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-title-input {
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--text);
      font-size: 13px;
      padding: 2px 6px;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }
    #search-container {
      padding: 8px 12px 4px;
    }
    #search-input {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 16px;
      padding: 6px 10px;
      outline: none;
    }
    #search-input:focus {
      border-color: var(--accent);
    }
    #search-input::placeholder {
      color: var(--muted);
    }

    /* ── Main area ── */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* top bar (mobile hamburger) */
    #topbar {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      align-items: center; gap: 10px;
    }
    #hamburger {
      background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; line-height: 1;
    }
    #topbar-title { color: var(--accent); font-size: 15px; font-weight: bold; }

    /* thread */
    #thread {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 16px;
      display: flex; flex-direction: column; gap: 16px;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }
    #thread::-webkit-scrollbar { width: 6px; }
    #thread::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg { display: flex; flex-direction: column; max-width: 80%; min-width: 0; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; max-width: min(80%, 100%); }

    .bubble {
      padding: 10px 14px; border-radius: 8px; line-height: 1.6;
      overflow: hidden; max-width: 100%; word-break: break-word;
      -webkit-user-select: text; user-select: text;
      touch-action: pan-y;
    }
    .msg.user .bubble {
      background: var(--user-bubble); border: 1px solid #2a5a3a;
      color: var(--text); white-space: pre-wrap;
    }
    .msg.assistant .bubble {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
    }

    /* markdown inside assistant bubbles */
    .bubble h1, .bubble h2, .bubble h3 { margin: .6em 0 .3em; color: var(--accent); }
    .bubble p { margin: .4em 0; }
    .bubble ul, .bubble ol { margin: .4em 0 .4em 1.4em; }
    .bubble li { margin: .2em 0; }
    .bubble code {
      background: #111; border: 1px solid var(--border);
      padding: 1px 5px; border-radius: 3px; font-family: inherit; font-size: 13px;
    }
    .bubble pre {
      background: #111; border: 1px solid var(--border);
      padding: 12px; border-radius: 6px; overflow-x: auto; margin: .6em 0;
      max-width: 100%; white-space: pre; box-sizing: border-box;
    }
    .bubble pre code { background: none; border: none; padding: 0; white-space: pre; word-break: normal; overflow-wrap: normal; }
    pre {
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
      user-select: none;
    }
    pre:hover .copy-btn {
      opacity: 1;
    }
    .copy-btn.copied {
      color: var(--accent);
      border-color: var(--accent);
    }
    .code-lang-label {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--surface2);
      color: var(--muted);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
      user-select: none;
      z-index: 2;
      text-transform: lowercase;
    }
    .bubble pre code.hljs {
      background: none;
      border: none;
      padding: 0;
    }
    .bubble blockquote {
      border-left: 3px solid var(--accent); padding-left: 10px;
      color: var(--muted); margin: .4em 0;
    }
    .bubble a { color: var(--accent); }
    .bubble table { border-collapse: collapse; width: 100%; margin: .6em 0; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
    .bubble th { background: var(--surface2); }

    /* message action buttons */
    .msg-actions {
      display: flex; gap: 4px; margin-top: 6px;
      justify-content: flex-end;
      opacity: 0; transition: opacity .15s;
    }
    .msg:hover .msg-actions { opacity: 1; }
    .msg.actions-visible .msg-actions { opacity: 1; }
    .msg-action-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; color: var(--muted); font-size: 11px;
      padding: 2px 8px; cursor: pointer; font-family: inherit;
      line-height: 1.4; transition: color .15s, border-color .15s;
    }
    .msg-action-btn:hover { color: var(--text); border-color: var(--accent); }
    .bubble .edit-textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--accent);
      border-radius: 4px; color: var(--text); font-family: inherit;
      font-size: 14px; padding: 6px 8px; resize: none; outline: none;
      min-height: 42px; margin-bottom: 4px;
    }

    /* timestamp tooltip on hover */
    .bubble[data-ts] { position: relative; }
    .bubble[data-ts]:hover::after {
      content: attr(data-ts);
      position: absolute;
      bottom: calc(100% + 6px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      padding: 3px 8px;
      border-radius: 4px;
      pointer-events: none;
      z-index: 10;
    }
    .msg.user .bubble[data-ts]:hover::after { right: 0; }
    .msg.assistant .bubble[data-ts]:hover::after { left: 0; }

    /* session-lost banner */
    #session-lost-banner {
      display: none;
      background: #2a1a00;
      border-bottom: 1px solid #664400;
      color: #ffaa44;
      font-size: 13px;
      padding: 8px 16px;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #session-lost-banner.visible { display: flex; }
    #session-lost-banner span { flex: 1; }
    #session-lost-dismiss {
      background: none; border: none; color: #ffaa44;
      font-size: 16px; cursor: pointer; line-height: 1; padding: 0 4px;
    }

    /* thinking indicator */
    .thinking-bubble {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--bg) !important;
      border: 1px solid var(--border);
      padding: 10px 16px !important;
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .thinking-pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      animation: thinkPulse 1.2s ease-in-out infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    .thinking-text { font-weight: 500; }
    .thinking-elapsed { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    @keyframes thinkPulse { 0%,100% { opacity:.3; transform:scale(.7); } 50% { opacity:1; transform:scale(1); } }

    /* input area */
    #input-area {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      width: 100%;
    }
    #msg-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 6px; font-family: inherit; font-size: 14px;
      resize: none; min-height: 42px; max-height: 200px; overflow-y: auto;
      outline: none; line-height: 1.5;
    }
    #msg-input:focus { border-color: var(--accent); }
    #attach-btn {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0 12px; font-size: 20px; cursor: pointer;
      transition: border-color .15s, color .15s; height: 42px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #attach-btn:hover { border-color: var(--accent); color: var(--accent); }
    #send-btn {
      background: var(--accent); color: #000; border: none; border-radius: 6px;
      padding: 10px 18px; font-family: inherit; font-size: 14px; font-weight: bold;
      cursor: pointer; transition: opacity .15s; white-space: nowrap; flex-shrink: 0;
      height: 42px;
    }
    #send-btn:hover:not(:disabled) { opacity: .85; }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Attachments ── */
    #attachment-previews {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .attachment-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: min(240px, 100%);
      min-width: 0;
      height: 24px;
      padding: 0 4px 0 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--surface2) 72%, transparent);
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }
    .attachment-icon {
      flex: 0 0 auto;
      font-size: 12px;
      opacity: .8;
    }
    .attachment-name {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .attachment-remove {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      line-height: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .attachment-remove:hover {
      background: color-mix(in srgb, var(--muted) 18%, transparent);
      color: var(--text);
    }

    /* ── Drag overlay ── */
    #drag-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #drag-overlay.active { display: flex; }
    .drag-overlay-box {
      border: 2px dashed var(--accent); border-radius: 12px;
      padding: 40px 60px; color: var(--text);
      font-size: 20px; font-weight: bold; text-align: center;
    }

    /* Toast */
    #toast {
      position: fixed; bottom: 90px; left: 50%;
      transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 10px 18px; border-radius: 6px;
      font-size: 13px; z-index: 300; display: none; white-space: nowrap;
    }
    #toast.error { border-color: #ff4466; color: #ff4466; }
    #toast.visible { display: block; }

    /* ── Artifact viewer panel ── */
    #artifact-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 520px;
      max-width: 100vw;
      z-index: 80;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transform: translateX(120%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
      box-shadow: -8px 0 32px rgba(0,0,0,.35);
    }
    #artifact-panel.open {
      transform: translateX(0);
    }
    .artifact-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface2);
    }
    .artifact-panel-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .artifact-panel-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .artifact-panel-actions button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 4px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      line-height: 1.4;
    }
    .artifact-panel-actions button:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    #artifact-panel-content {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    .artifact-iframe-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .artifact-iframe-wrap iframe {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
      min-height: 200px;
    }
    .artifact-code-wrap {
      flex: 1;
      position: relative;
      overflow: auto;
      background: #111;
    }
    .artifact-code-wrap pre {
      margin: 0;
      background: #111 !important;
      border: none !important;
      border-radius: 0 !important;
    }
    .artifact-code-wrap .copy-btn {
      opacity: 1 !important;
    }
    .artifact-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
      padding: 40px;
      text-align: center;
    }

    @media (max-width: 767px) {
      #artifact-panel {
        width: 100vw;
        top: auto;
        left: 0; right: 0; bottom: 0;
        height: 92vh;
        transform: translateY(110%);
        border-left: none;
        border-top: 1px solid var(--border);
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -8px 32px rgba(0,0,0,.35);
        transition: transform .28s cubic-bezier(.4,0,.2,1);
      }
      #artifact-panel.open {
        transform: translateY(0);
      }
    }

    /* Mobile overlay sidebar */
    #sidebar-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.6);
    }
    @media (max-width: 767px) {
      #sidebar {
        position: fixed; inset: 0 auto 0 0; z-index: 60;
        transform: translateX(-100%);
        transition: transform .25s ease;
        width: 280px;
      }
      #sidebar.open { transform: translateX(0); }
      #sidebar-overlay.open { display: block; }
      #topbar { display: flex; }
      .msg { max-width: 95%; }
      #thread { padding: 12px 10px; }
      #input-area { padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
      #msg-input { font-size: 16px; /* prevent iOS zoom on focus */ }
      .login-box { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<!-- Login overlay -->
<div id="login-overlay">
  <div class="login-box">
    <h1>hermes-proxy</h1>
    <input type="password" id="pw-input" placeholder="Password"
      autocomplete="new-password"
      data-lpignore="true"
      data-1p-ignore="true"
      data-bwignore="true" />
    <button id="login-btn">Login</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- Main app -->
<div id="app" class="hidden">
  <!-- Mobile overlay background -->
  <div id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <button id="new-session-btn">+ New</button>
      <button id="logout-btn" title="Logout">⏻</button>
    </div>
    <div id="search-container">
      <input id="search-input" type="text" placeholder="Search sessions…" autocomplete="off" />
    </div>
    <div id="session-list"></div>
    <button id="load-more-btn" style="display:none" title="Load older sessions">Load more</button>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <button id="hamburger">&#9776;</button>
      <span id="topbar-title">hermes</span>
    </div>
    <div id="session-lost-banner">
      <span>Session mapping lost — server was restarted. Pick a session from the sidebar or start a new one.</span>
      <button id="session-lost-dismiss" title="Dismiss">&#10005;</button>
    </div>
    <div id="thread"></div>
    <div id="input-area">
      <div id="attachment-previews"></div>
      <input type="file" id="file-input" accept="image/*" multiple style="display:none" />
      <div class="input-row">
        <button id="attach-btn" title="Attach image">&#128206;</button>
        <textarea id="msg-input" placeholder="Message hermes…" rows="1"></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/hermes-proxy.js" defer></script>
<script src="/static/app.js" defer></script>

  <!-- Artifact viewer panel -->
<div id="artifact-panel">
  <div class="artifact-panel-header">
    <span class="artifact-panel-title" id="artifact-panel-title">Artifact</span>
    <div class="artifact-panel-actions">
      <button id="artifact-run" title="Run Python code" style="display:none;">Run</button>
      <button id="artifact-copy" title="Copy code to clipboard">Copy</button>
      <button id="artifact-download" title="Download as file">Download</button>
      <button id="artifact-close" title="Close">&#10005;</button>
    </div>
  </div>
  <div id="artifact-panel-content">
    <div class="artifact-empty" id="artifact-empty">No artifact selected.<br>Click an <b>Open in Artifact</b> button on a code block to preview it here.</div>
  </div>
</div>

<!-- Drag-and-drop overlay -->
<div id="drag-overlay">
  <div class="drag-overlay-box">Drop images here</div>
</div>

<div id="toast"></div>

</body>
</html>
